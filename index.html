<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seterra Eredmény Ellenőrző</title>

    <meta name="description" content="Seterra eredményellenőrző tanároknak: hasonlítsd össze az osztálynévsort több Seterra feladat eredményével, ellenőrizd a névegyezéseket, majd exportáld az összesítést CSV- vagy Excel-fájlba.">
    
    <!-- SheetJS könyvtár - defer = ne blokkolja az oldal betöltését -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
    <style>

        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;

            border-radius: 16px;

        }

        .subtitle {

            font-size: 1.1em;
            margin-bottom: 30px;
        }

        .offline-badge {
            display: inline-block;
            background: #48bb78;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-left: 10px;
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 14px;
            transition: border-color 0.3s;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #48bb78;
            color: white;
        }

        .btn-secondary:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(72, 187, 120, 0.4);
        }

        .btn-clear {
            background: #e53e3e;
            color: white;
        }

        .btn-clear:hover {
            background: #c53030;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        #results {
            margin-top: 40px;
            display: none;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .results-header h2 {
            color: #2d3748;
            font-size: 2em;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            font-weight: 600;
            font-size: 1.05em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background: #f7fafc;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .matched {
            color: #38a169;
            font-weight: 500;
        }

        .duplicate {
            color: #dd6b20;
            font-weight: 500;
        }

        .warning {
            background: #fef5e7;
            border-left: 4px solid #f39c12;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .warning-title {
            font-weight: 600;
            color: #d68910;
            margin-bottom: 5px;
        }

        .info {
            background: #ebf8ff;
            border-left: 4px solid #3182ce;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
            color: #2c5282;
        }

        .loader {
            display: none;

            padding: 20px;
        }

        .loader.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .stat-card {
            background: #f7fafc;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .stat-number {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            color: #718096;
            font-size: 0.9em;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Seterra Eredmény Ellenőrző <span class="offline-badge">v9</span></h1>
        <p class="subtitle">Seterra feladatok automatikus kiértékelése - Egybeírt nevek + false positive javítás</p>

        <div class="input-section">
            <div class="input-group">
                <label for="originalList">📋 Eredeti névsor (enterekkel elválasztva):</label>
                <textarea id="originalList" placeholder="Másold be ide az eredeti osztálynévsort...
(Minden név külön sorba)"></textarea>
            </div>

            <div class="input-group">
                <label for="taskList1">📝 1. feladatlista (Seterra eredmény):</label>
                <textarea id="taskList1" placeholder="Másold be ide az 1. Seterra feladat eredményeit...
(Formátum: sorszám.Név100%idődátum)"></textarea>
            </div>

            <div class="input-group">
                <label for="taskList2">📝 2. feladatlista (opcionális):</label>
                <textarea id="taskList2" placeholder="Hagyd üresen, ha nincs második lista..."></textarea>
            </div>

            <div class="input-group">
                <label for="taskList3">📝 3. feladatlista (opcionális):</label>
                <textarea id="taskList3" placeholder="Hagyd üresen, ha nincs harmadik lista..."></textarea>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="processData()">✨ Táblázat készítése</button>
                <button class="btn-clear" onclick="clearAll()">🗑️ Törlés</button>
            </div>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #718096;">Feldolgozás folyamatban...</p>
        </div>

        <div id="results">
            <div class="results-header">
                <h2>📊 Eredmény</h2>
                <div class="export-buttons">
                    <div style="text-align: center; margin-right: 20px;">
                        <button class="btn-secondary" onclick="exportToExcel()">📥 Excel (XLSX) letöltése</button>
                        <div style="font-size: 0.85em; color: #718096; margin-top: 5px;">
                            ℹ️ Első használathoz internetkapcsolat szükséges
                        </div>
                    </div>
                    <div style="text-align: center;">
                        <button class="btn-secondary" onclick="exportToCSV()">📥 CSV letöltése</button>
                        <div style="font-size: 0.85em; color: #48bb78; margin-top: 5px;">
                            ✅ Mindig működik (Excel-ben is megnyitható)
                        </div>
                    </div>
                </div>
            </div>
            
            <div id="statsContainer"></div>
            <div id="warningsContainer"></div>
            <div id="tableContainer"></div>
        </div>
    </div>

    <script>
        // Levenshtein távolság számítás
        function levenshteinDistance(str1, str2) {
            const matrix = [];
            
            for (let i = 0; i <= str2.length; i++) {
                matrix[i] = [i];
            }
            
            for (let j = 0; j <= str1.length; j++) {
                matrix[0][j] = j;
            }
            
            for (let i = 1; i <= str2.length; i++) {
                for (let j = 1; j <= str1.length; j++) {
                    if (str2.charAt(i - 1) === str1.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1,
                            matrix[i][j - 1] + 1,
                            matrix[i - 1][j] + 1
                        );
                    }
                }
            }
            
            return matrix[str2.length][str1.length];
        }

        // Normalizált név (ékezetek nélkül, kisbetűvel, szóközök nélkül)
        function normalizeString(str) {
            return str
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]/g, '');
        }

        // Név tokenizálás - JAVÍTOTT: kötőjelek megtartása
        function tokenize(name) {
            return name
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .split(/[^a-z0-9\-]+/)
                .filter(t => t.length > 0);
        }

        // Vezetéknév detektálás - JAVÍTOTT verzió
        function detectNameParts(taskName) {
            // CamelCase felismerés (kötőjellel is)
            // Keressük meg az első "kis-nagy" betű váltást
            const firstCapitalIndex = taskName.search(/[a-záéíóöőúüű][A-ZÁÉÍÓÖŐÚÜŰ]/);
            
            if (firstCapitalIndex !== -1) {
                // Van CamelCase váltás
                const lastName = taskName.substring(0, firstCapitalIndex + 1);
                const restName = taskName.substring(firstCapitalIndex + 1);
                
                // További CamelCase tokenek keresése
                const restTokens = restName.split(/(?=[A-ZÁÉÍÓÖŐÚÜŰ])/).filter(t => t.length > 0);
                
                return { 
                    hasLastName: true, 
                    lastName: lastName, 
                    firstNames: restTokens 
                };
            }
            
            // Szóköz/pont/aláhúzás alapú
            if (taskName.includes(' ') || taskName.includes('.') || taskName.includes('_')) {
                const parts = taskName.split(/[\s._]+/).filter(t => t.length > 0);
                if (parts.length >= 2) {
                    return { 
                        hasLastName: true, 
                        lastName: parts[0], 
                        firstNames: parts.slice(1) 
                    };
                }
            }
            
            // Csak keresztnév
            return { 
                hasLastName: false, 
                lastName: null, 
                firstNames: [taskName] 
            };
        }

        // Token hasonlóság számítás - V9 JAVÍTOTT: substring matching eltávolítva
        function tokenSimilarity(token1, token2) {
            const norm1 = normalizeString(token1);
            const norm2 = normalizeString(token2);
            
            // Tökéletes egyezés
            if (norm1 === norm2) return 100;
            
            // Levenshtein távolság alapú hasonlóság
            const maxLen = Math.max(norm1.length, norm2.length);
            const distance = levenshteinDistance(norm1, norm2);
            const similarity = (1 - distance / maxLen) * 100;
            
            return similarity;
        }

        // Név párosítás - V8: 85% teljes egyezés + vesszős név + FORDÍTOTT NÉV felismerés
        function matchName(originalName, taskName) {
            // KRITIKUS: Vesszős nevek kiszűrése
            if (taskName.includes(',')) {
                return { score: 0, match: false };
            }
            
            // Teljes normalizált név egyezés
            const normOriginal = normalizeString(originalName);
            const normTask = normalizeString(taskName);
            
            // 100% egyezés
            if (normOriginal === normTask) {
                return { score: 100, match: true };
            }
            
            // TELJES NÉV HASONLÓSÁG - 85% küszöb
            // Ez kezeli az egybeírt, kisbetűs neveket
            const fullNameSimilarity = tokenSimilarity(originalName, taskName);
            if (fullNameSimilarity >= 85) {
                return { score: fullNameSimilarity, match: true };
            }
            
            // Token-alapú párosítás
            const taskInfo = detectNameParts(taskName);
            const origTokens = tokenize(originalName);
            
            if (origTokens.length === 0) {
                return { score: 0, match: false };
            }
            
            const origLastName = origTokens[0];
            
            // ESET 1: Van vezetéknév a Seterra névben
            if (taskInfo.hasLastName) {
                // Vezetéknév egyezés - SZIGORÚ: 88%
                const lastNameScore = tokenSimilarity(origLastName, taskInfo.lastName);
                
                if (lastNameScore < 88) {
                    // ÚJ: FORDÍTOTT NÉV PRÓBA!
                    // Ha vezetéknév nem egyezik, lehet hogy fordítva írták be
                    // Eredeti: [Vezetéknév] [Keresztnév] (magyar)
                    // Seterra: [Keresztnév] [Vezetéknév] (nemzetközi)
                    
                    // Próbáljuk fordítva: taskInfo.lastName legyen az eredeti keresztnév
                    let reversedMatch = false;
                    for (let i = 1; i < origTokens.length; i++) {
                        const origFirst = origTokens[i];
                        const reverseLastScore = tokenSimilarity(origFirst, taskInfo.lastName);
                        
                        if (reverseLastScore >= 88) {
                            // A Seterra "vezetéknév" egyezik egy eredeti keresztnévvel!
                            // Most nézzük meg, hogy a Seterra "keresztnév" egyezik-e az eredeti vezetéknévvel
                            
                            for (const taskFirst of taskInfo.firstNames) {
                                const reverseFirstScore = tokenSimilarity(origLastName, taskFirst);
                                
                                if (reverseFirstScore >= 88) {
                                    // FORDÍTOTT NÉV TALÁLAT!
                                    reversedMatch = true;
                                    break;
                                }
                            }
                            
                            if (reversedMatch) {
                                return { score: 85, match: true }; // Alacsonyabb score, mert fordított
                            }
                        }
                    }
                    
                    // Ha fordítva sem egyezik, nincs match
                    return { score: 0, match: false };
                }
                
                // Keresztnevek ellenőrzése - SZIGORÚ: 85%
                let firstNameMatches = 0;
                const taskFirstNames = taskInfo.firstNames;
                
                for (const taskFirst of taskFirstNames) {
                    for (let i = 1; i < origTokens.length; i++) {
                        const origFirst = origTokens[i];
                        const score = tokenSimilarity(origFirst, taskFirst);
                        if (score >= 85) {
                            firstNameMatches++;
                            break;
                        }
                    }
                }
                
                // Ha legalább 1 keresztnév egyezik
                if (firstNameMatches > 0) {
                    const totalScore = 80 + (firstNameMatches / taskFirstNames.length) * 15;
                    return { score: totalScore, match: true };
                }
                
                // Vezetéknév egyezik, de keresztnév nem
                return { score: 60, match: true };
            }
            
            // ESET 2: Nincs vezetéknév - csak keresztnév
            else {
                const taskFirstName = taskInfo.firstNames[0];
                
                // Keresztnév keresése - SZIGORÚ: 90%
                let bestFirstNameScore = 0;
                
                for (let i = 1; i < origTokens.length; i++) {
                    const origFirst = origTokens[i];
                    const score = tokenSimilarity(origFirst, taskFirstName);
                    bestFirstNameScore = Math.max(bestFirstNameScore, score);
                }
                
                // SZIGORÚ küszöb: 90%
                if (bestFirstNameScore >= 90) {
                    return { score: 70 + (bestFirstNameScore - 90) / 2, match: true };
                }
                
                return { score: bestFirstNameScore, match: false };
            }
        }

        // Seterra sor feldolgozása
        function parseTaskLine(line) {
            // Format: sorszám.Név100%idődátum
            const match = line.match(/^(\d+)\.(.*?)(\d+%)/);
            if (match) {
                return match[2].trim();
            }
            return null;
        }

        // Névsor feldolgozása
        function parseNameList(text) {
            return text
                .split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);
        }

        // Feladatlista feldolgozása
        function parseTaskList(text) {
            const lines = text.split('\n').filter(line => line.trim().length > 0);
            const names = [];
            
            for (const line of lines) {
                const name = parseTaskLine(line);
                if (name) {
                    names.push(name);
                }
            }
            
            return names;
        }

        // Adatok feldolgozása
        function processData() {
            const originalText = document.getElementById('originalList').value.trim();
            const task1Text = document.getElementById('taskList1').value.trim();
            const task2Text = document.getElementById('taskList2').value.trim();
            const task3Text = document.getElementById('taskList3').value.trim();
            
            if (!originalText || !task1Text) {
                alert('⚠️ Kérlek töltsd ki az eredeti névsort és legalább az 1. feladatlistát!');
                return;
            }
            
            // Loader megjelenítése
            document.getElementById('loader').classList.add('active');
            document.getElementById('results').style.display = 'none';
            
            // Rövid késleltetés a vizuális visszajelzéshez
            setTimeout(() => {
                try {
                    const originalNames = parseNameList(originalText);
                    const taskLists = [];
                    
                    if (task1Text) taskLists.push(parseTaskList(task1Text));
                    if (task2Text) taskLists.push(parseTaskList(task2Text));
                    if (task3Text) taskLists.push(parseTaskList(task3Text));
                    
                    const results = buildResultTable(originalNames, taskLists);
                    displayResults(results, originalNames, taskLists);
                } catch (error) {
                    alert('❌ Hiba történt a feldolgozás során: ' + error.message);
                    console.error(error);
                } finally {
                    document.getElementById('loader').classList.remove('active');
                }
            }, 300);
        }

        // Eredmény táblázat építése - ÚJ ALGORITMUS
        function buildResultTable(originalNames, taskLists) {
            const results = [];
            const warnings = [];
            
            // Duplikált eredeti nevek keresése
            const nameCounts = {};
            originalNames.forEach(name => {
                nameCounts[name] = (nameCounts[name] || 0) + 1;
            });
            
            const duplicateNames = Object.keys(nameCounts).filter(name => nameCounts[name] > 1);
            if (duplicateNames.length > 0) {
                warnings.push({
                    type: 'duplicate',
                    message: `Az eredeti névsorban ${duplicateNames.length} név többször szerepel: ${duplicateNames.join(', ')}`
                });
            }
            
            // Minden feladatlistára
            for (let listIndex = 0; listIndex < taskLists.length; listIndex++) {
                const taskList = taskLists[listIndex];
                
                // 1. LÉPÉS: Készítsünk score mátrixot
                const scoreMatrix = [];
                for (let i = 0; i < originalNames.length; i++) {
                    const originalName = originalNames[i];
                    const row = [];
                    
                    for (let j = 0; j < taskList.length; j++) {
                        const taskName = taskList[j];
                        const matchResult = matchName(originalName, taskName);
                        row.push({
                            taskIndex: j,
                            taskName: taskName,
                            score: matchResult.score,
                            match: matchResult.match
                        });
                    }
                    
                    // Rendezés score szerint (csökkenő)
                    row.sort((a, b) => b.score - a.score);
                    scoreMatrix.push(row);
                }
                
                // 2. LÉPÉS: Greedy matching - minden task név csak egyszer!
                const usedTaskIndices = new Set();
                const listResults = [];
                
                for (let i = 0; i < originalNames.length; i++) {
                    let assigned = false;
                    
                    // Próbáljuk meg a legjobb még nem használt matchet
                    for (const candidate of scoreMatrix[i]) {
                        if (!usedTaskIndices.has(candidate.taskIndex) && candidate.match) {
                            listResults.push(candidate.taskName);
                            usedTaskIndices.add(candidate.taskIndex);
                            assigned = true;
                            break;
                        }
                    }
                    
                    if (!assigned) {
                        listResults.push('');
                    }
                }
                
                // Ha ez az első lista, inicializáljuk a results-ot
                if (listIndex === 0) {
                    for (let i = 0; i < originalNames.length; i++) {
                        results.push({
                            original: originalNames[i],
                            tasks: [listResults[i]]
                        });
                    }
                } else {
                    // Hozzáadjuk a következő lista eredményeit
                    for (let i = 0; i < originalNames.length; i++) {
                        results[i].tasks.push(listResults[i]);
                    }
                }
            }
            
            // Duplikációk jelölése - ha ugyanaz a név többször szerepel egy listában
            for (let listIndex = 0; listIndex < taskLists.length; listIndex++) {
                const taskList = taskLists[listIndex];
                const taskNameCounts = {};
                
                taskList.forEach(name => {
                    taskNameCounts[name] = (taskNameCounts[name] || 0) + 1;
                });
                
                // Minden eredményben: ha a task név többször szerepel, adjuk hozzá az "Nx" jelölést
                for (const row of results) {
                    const taskName = row.tasks[listIndex];
                    if (taskName && taskNameCounts[taskName] > 1) {
                        // Számoljuk meg, hogy eddig hányszor szerepelt már ez a név
                        let countBefore = 0;
                        for (let i = 0; i < results.indexOf(row); i++) {
                            if (results[i].tasks[listIndex] === taskName) {
                                countBefore++;
                            }
                        }
                        
                        // Ha ez az első előfordulás, adjuk hozzá a számot
                        if (countBefore === 0 && taskNameCounts[taskName] > 1) {
                            row.tasks[listIndex] = `${taskName} ${taskNameCounts[taskName]}x`;
                        }
                    }
                }
            }
            
            // Párosítatlan Seterra nevek keresése
            const unmatchedTasks = [];
            
            for (let listIndex = 0; listIndex < taskLists.length; listIndex++) {
                const taskList = taskLists[listIndex];
                const usedInThisList = new Set();
                
                // Gyűjtsük össze, melyek lettek felhasználva
                for (const row of results) {
                    const taskName = row.tasks[listIndex];
                    if (taskName && taskName !== '') {
                        // Ha van "2x" jelölés, távolítsuk el
                        const cleanName = taskName.replace(/ \d+x$/, '');
                        usedInThisList.add(cleanName);
                    }
                }
                
                // Keressük meg a párosítatlanokat
                for (const taskName of taskList) {
                    if (!usedInThisList.has(taskName)) {
                        // Ez a név nem lett párosítva
                        if (!unmatchedTasks[listIndex]) {
                            unmatchedTasks[listIndex] = [];
                        }
                        unmatchedTasks[listIndex].push(taskName);
                    }
                }
            }
            
            return { results, warnings, unmatchedTasks };
        }

        // Eredmények megjelenítése
        function displayResults(data, originalNames, taskLists) {
            const { results, warnings, unmatchedTasks } = data;
            
            // Statisztikák
            const stats = calculateStats(results, taskLists.length);
            displayStats(stats);
            
            // Figyelmeztetések
            if (warnings.length > 0) {
                displayWarnings(warnings);
            }
            
            // Táblázat
            let html = '<table><thead><tr>';
            html += '<th>Névsor</th>';
            for (let i = 0; i < taskLists.length; i++) {
                html += `<th>${i + 1}. lista</th>`;
            }
            html += '</tr></thead><tbody>';
            
            for (const row of results) {
                html += '<tr>';
                html += `<td><strong>${row.original}</strong></td>`;
                for (const task of row.tasks) {
                    if (task === '') {
                        html += '<td style="color: #cbd5e0;">—</td>';
                    } else if (task.includes('x')) {
                        html += `<td class="duplicate">${task}</td>`;
                    } else {
                        html += `<td class="matched">${task}</td>`;
                    }
                }
                html += '</tr>';
            }
            
            // Párosítatlan Seterra nevek hozzáadása
            if (unmatchedTasks && unmatchedTasks.length > 0) {
                let hasUnmatched = false;
                for (let i = 0; i < unmatchedTasks.length; i++) {
                    if (unmatchedTasks[i] && unmatchedTasks[i].length > 0) {
                        hasUnmatched = true;
                        break;
                    }
                }
                
                if (hasUnmatched) {
                    // Elválasztó vonal
                    html += '<tr style="border-top: 3px solid #e53e3e;"><td colspan="' + (taskLists.length + 1) + '" style="background: #fff5f5; text-align: center; font-weight: 600; color: #c53030; padding: 10px;">⚠️ Párosítatlan nevek (nem találták meg az eredeti listában)</td></tr>';
                    
                    // Maximum sorok száma
                    let maxUnmatchedRows = 0;
                    for (let i = 0; i < unmatchedTasks.length; i++) {
                        if (unmatchedTasks[i]) {
                            maxUnmatchedRows = Math.max(maxUnmatchedRows, unmatchedTasks[i].length);
                        }
                    }
                    
                    // Párosítatlan nevek sorai
                    for (let rowIndex = 0; rowIndex < maxUnmatchedRows; rowIndex++) {
                        html += '<tr style="background: #fff5f5;">';
                        html += '<td style="color: #cbd5e0;">—</td>';
                        
                        for (let listIndex = 0; listIndex < taskLists.length; listIndex++) {
                            if (unmatchedTasks[listIndex] && unmatchedTasks[listIndex][rowIndex]) {
                                const unmatchedName = unmatchedTasks[listIndex][rowIndex];
                                
                                // Külön jelzés vesszős neveknél
                                if (unmatchedName.includes(',')) {
                                    html += `<td style="color: #e53e3e; font-weight: 600;" title="Összetett név - vesszővel elválasztva">📝 ${unmatchedName}</td>`;
                                } else {
                                    html += `<td style="color: #e53e3e; font-weight: 600;">${unmatchedName}</td>`;
                                }
                            } else {
                                html += '<td></td>';
                            }
                        }
                        
                        html += '</tr>';
                    }
                }
            }
            
            html += '</tbody></table>';
            
            document.getElementById('tableContainer').innerHTML = html;
            document.getElementById('results').style.display = 'block';
            
            // Smooth scroll az eredményekhez
            document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Statisztikák számítása
        function calculateStats(results, listCount) {
            const stats = {
                totalStudents: results.length,
                completions: []
            };
            
            for (let i = 0; i < listCount; i++) {
                const completed = results.filter(r => r.tasks[i] !== '').length;
                stats.completions.push({
                    list: i + 1,
                    count: completed,
                    percentage: Math.round((completed / results.length) * 100)
                });
            }
            
            return stats;
        }

        // Statisztikák megjelenítése
        function displayStats(stats) {
            let html = '<div class="stats">';
            html += `<div class="stat-card">
                <div class="stat-number">${stats.totalStudents}</div>
                <div class="stat-label">Összes tanuló</div>
            </div>`;
            
            for (const comp of stats.completions) {
                html += `<div class="stat-card">
                    <div class="stat-number">${comp.count}</div>
                    <div class="stat-label">${comp.list}. lista - ${comp.percentage}% teljesítette</div>
                </div>`;
            }
            
            html += '</div>';
            document.getElementById('statsContainer').innerHTML = html;
        }

        // Figyelmeztetések megjelenítése
        function displayWarnings(warnings) {
            let html = '';
            for (const warning of warnings) {
                html += `<div class="warning">
                    <div class="warning-title">⚠️ Figyelmeztetés</div>
                    <div>${warning.message}</div>
                </div>`;
            }
            document.getElementById('warningsContainer').innerHTML = html;
        }

        // CSV export
        function exportToCSV() {
            const originalText = document.getElementById('originalList').value.trim();
            const task1Text = document.getElementById('taskList1').value.trim();
            const task2Text = document.getElementById('taskList2').value.trim();
            const task3Text = document.getElementById('taskList3').value.trim();
            
            const originalNames = parseNameList(originalText);
            const taskLists = [];
            
            if (task1Text) taskLists.push(parseTaskList(task1Text));
            if (task2Text) taskLists.push(parseTaskList(task2Text));
            if (task3Text) taskLists.push(parseTaskList(task3Text));
            
            const { results, unmatchedTasks } = buildResultTable(originalNames, taskLists);
            
            // CSV fejléc
            let csvContent = 'Névsor';
            for (let i = 0; i < taskLists.length; i++) {
                csvContent += `,${i + 1}. lista`;
            }
            csvContent += '\n';
            
            // CSV sorok
            for (const row of results) {
                let escapedName = row.original;
                if (escapedName.includes(',') || escapedName.includes('"') || escapedName.includes('\n')) {
                    escapedName = '"' + escapedName.replace(/"/g, '""') + '"';
                }
                csvContent += escapedName;
                
                for (const task of row.tasks) {
                    let escapedTask = task;
                    if (escapedTask.includes(',') || escapedTask.includes('"') || escapedTask.includes('\n')) {
                        escapedTask = '"' + escapedTask.replace(/"/g, '""') + '"';
                    }
                    csvContent += ',' + (escapedTask === '' ? '' : escapedTask);
                }
                csvContent += '\n';
            }
            
            // Párosítatlan nevek hozzáadása
            if (unmatchedTasks && unmatchedTasks.length > 0) {
                let hasUnmatched = false;
                for (let i = 0; i < unmatchedTasks.length; i++) {
                    if (unmatchedTasks[i] && unmatchedTasks[i].length > 0) {
                        hasUnmatched = true;
                        break;
                    }
                }
                
                if (hasUnmatched) {
                    // Elválasztó sor
                    csvContent += '\n';
                    csvContent += '"⚠️ PÁROSÍTATLAN NEVEK"';
                    for (let i = 0; i < taskLists.length; i++) {
                        csvContent += ',';
                    }
                    csvContent += '\n';
                    
                    // Maximum sorok száma
                    let maxUnmatchedRows = 0;
                    for (let i = 0; i < unmatchedTasks.length; i++) {
                        if (unmatchedTasks[i]) {
                            maxUnmatchedRows = Math.max(maxUnmatchedRows, unmatchedTasks[i].length);
                        }
                    }
                    
                    // Párosítatlan nevek sorai
                    for (let rowIndex = 0; rowIndex < maxUnmatchedRows; rowIndex++) {
                        csvContent += '';
                        
                        for (let listIndex = 0; listIndex < taskLists.length; listIndex++) {
                            if (unmatchedTasks[listIndex] && unmatchedTasks[listIndex][rowIndex]) {
                                let name = unmatchedTasks[listIndex][rowIndex];
                                
                                // Vesszős nevek jelzése
                                if (name.includes(',')) {
                                    name = '📝 ' + name; // Jelzés az Excel-ben is
                                }
                                
                                if (name.includes(',') || name.includes('"') || name.includes('\n')) {
                                    name = '"' + name.replace(/"/g, '""') + '"';
                                }
                                csvContent += ',' + name;
                            } else {
                                csvContent += ',';
                            }
                        }
                        csvContent += '\n';
                    }
                }
            }
            
            // UTF-8 BOM
            const BOM = '\uFEFF';
            const blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' });
            
            // Letöltés
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            const date = new Date().toISOString().split('T')[0];
            link.setAttribute('href', url);
            link.setAttribute('download', `seterra_eredmenyek_${date}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Excel (XLSX) export - SheetJS könyvtárral
        function exportToExcel() {
            // Ellenőrizzük, hogy a SheetJS betöltődött-e
            if (typeof XLSX === 'undefined') {
                alert('⚠️ Az Excel export nem érhető el offline módban.\n\nKérlek, nyisd meg ezt az oldalt internetkapcsolattal egyszer, hogy a szükséges könyvtár letöltődjön.\n\nAddig használd a CSV letöltést, ami Excel-ben is megnyitható!');
                return;
            }
            
            const originalText = document.getElementById('originalList').value.trim();
            const task1Text = document.getElementById('taskList1').value.trim();
            const task2Text = document.getElementById('taskList2').value.trim();
            const task3Text = document.getElementById('taskList3').value.trim();
            
            const originalNames = parseNameList(originalText);
            const taskLists = [];
            
            if (task1Text) taskLists.push(parseTaskList(task1Text));
            if (task2Text) taskLists.push(parseTaskList(task2Text));
            if (task3Text) taskLists.push(parseTaskList(task3Text));
            
            const { results, unmatchedTasks } = buildResultTable(originalNames, taskLists);
            
            // Excel adatok előkészítése - MINDEN KÜLÖN SORBAN
            const data = [];
            
            // Fejléc
            const header = ['Névsor'];
            for (let i = 0; i < taskLists.length; i++) {
                header.push(`${i + 1}. lista`);
            }
            data.push(header);
            
            // Párosított eredmények
            for (const row of results) {
                const rowData = [row.original];
                for (const task of row.tasks) {
                    rowData.push(task === '' ? null : task);  // null = tényleg üres cella
                }
                data.push(rowData);
            }
            
            // Párosítatlan nevek hozzáadása
            if (unmatchedTasks && unmatchedTasks.length > 0) {
                let hasUnmatched = false;
                for (let i = 0; i < unmatchedTasks.length; i++) {
                    if (unmatchedTasks[i] && unmatchedTasks[i].length > 0) {
                        hasUnmatched = true;
                        break;
                    }
                }
                
                if (hasUnmatched) {
                    // Üres sor elválasztásnak
                    data.push([]);
                    
                    // Párosítatlan nevek fejléc
                    const unmatchedHeader = ['⚠️ PÁROSÍTATLAN NEVEK'];
                    for (let i = 0; i < taskLists.length; i++) {
                        unmatchedHeader.push(null);  // null = tényleg üres cella
                    }
                    data.push(unmatchedHeader);
                    
                    // Maximum sorok száma
                    let maxUnmatchedRows = 0;
                    for (let i = 0; i < unmatchedTasks.length; i++) {
                        if (unmatchedTasks[i]) {
                            maxUnmatchedRows = Math.max(maxUnmatchedRows, unmatchedTasks[i].length);
                        }
                    }
                    
                    // Párosítatlan nevek sorai - MINDEN KÜLÖN SORBAN
                    for (let rowIndex = 0; rowIndex < maxUnmatchedRows; rowIndex++) {
                        const unmatchedRow = [null];  // Első oszlop üres = null
                        
                        for (let listIndex = 0; listIndex < taskLists.length; listIndex++) {
                            if (unmatchedTasks[listIndex] && unmatchedTasks[listIndex][rowIndex]) {
                                let name = unmatchedTasks[listIndex][rowIndex];
                                
                                // Vesszős nevek jelzése
                                if (name.includes(',')) {
                                    name = '📝 ' + name;
                                }
                                
                                unmatchedRow.push(name);
                            } else {
                                unmatchedRow.push(null);  // null = tényleg üres cella
                            }
                        }
                        data.push(unmatchedRow);
                    }
                }
            }
            
            // Excel fájl létrehozása
            const ws = XLSX.utils.aoa_to_sheet(data);
            
            // Oszlopszélességek beállítása
            const colWidths = [{ wch: 30 }];
            for (let i = 0; i < taskLists.length; i++) {
                colWidths.push({ wch: 30 });
            }
            ws['!cols'] = colWidths;
            
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Eredmények');
            
            // Letöltés
            const date = new Date().toISOString().split('T')[0];
            XLSX.writeFile(wb, `seterra_eredmenyek_${date}.xlsx`);
        }

        // Összes törlése
        function clearAll() {
            if (confirm('Biztosan törölni szeretnéd az összes adatot?')) {
                document.getElementById('originalList').value = '';
                document.getElementById('taskList1').value = '';
                document.getElementById('taskList2').value = '';
                document.getElementById('taskList3').value = '';
                document.getElementById('results').style.display = 'none';
            }
        }
    </script>
